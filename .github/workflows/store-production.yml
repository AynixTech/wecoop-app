# Cloud store release — no Mac required for Android.
# Triggered by Anthony Dev Hub («Aprobar release») via workflow_dispatch.
#
# GitHub → Settings → Secrets and variables → Actions:
#   PLAY_PUBLISHER_JSON     (required) full Play service-account JSON
#   APP_STORE_KEY_ID        (optional iOS) e.g. P44NUU72Z4
#   APP_STORE_ISSUER_ID     (optional iOS)
#   APP_STORE_P8_BASE64     (optional iOS) base64 of AuthKey_*.p8
#   IOS_DIST_CERT_P12_BASE64 + IOS_DIST_CERT_PASSWORD + IOS_PROVISION_PROFILE_BASE64
#     (optional iOS signing — without these, only Android runs)

name: Store production (Hub)

on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        required: false
        default: production
      version:
        description: Marketing version (X.Y.Z)
        required: false
        default: ""
      build:
        description: Build number
        required: false
        default: ""
      source:
        description: Trigger source
        required: false
        default: anthony-dev-hub
      platforms:
        description: "android | ios | both"
        required: false
        default: both

jobs:
  android-play:
    name: Android → Play production
    if: ${{ github.event.inputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build AAB
        run: flutter build appbundle --release
      - name: Upload to Play (production)
        env:
          PLAY_PUBLISHER_JSON: ${{ secrets.PLAY_PUBLISHER_JSON }}
        run: |
          if [ -z "$PLAY_PUBLISHER_JSON" ]; then
            echo "::error::Missing secret PLAY_PUBLISHER_JSON"
            exit 1
          fi
          mkdir -p "$HOME/.wecoop"
          printf '%s' "$PLAY_PUBLISHER_JSON" > "$HOME/.wecoop/play-publisher.json"
          chmod 600 "$HOME/.wecoop/play-publisher.json"
          pip3 install --user 'google-api-python-client>=2.0' 'google-auth>=2.0'
          NOTES="WeCoop ${{ github.event.inputs.version }}+${{ github.event.inputs.build }} (Hub ${{ github.event.inputs.source }})"
          python3 tools/upload_aab.py \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --track "${{ github.event.inputs.track || 'production' }}" \
            --status completed \
            --notes "$NOTES"

  ios-appstore:
    name: iOS → App Store (cloud)
    if: ${{ github.event.inputs.platforms != 'android' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require iOS secrets
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
          APP_STORE_P8_BASE64: ${{ secrets.APP_STORE_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          missing=0
          for v in APP_STORE_KEY_ID APP_STORE_ISSUER_ID APP_STORE_P8_BASE64 \
                   IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_PROVISION_PROFILE_BASE64; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret $v (needed for cloud iOS release)"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "::notice::Until iOS secrets are set, Hub still releases Android via this workflow. Add certs once in repo Actions secrets."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Import signing + App Store key
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_P8_BASE64: ${{ secrets.APP_STORE_P8_BASE64 }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          PASS=temp-ci-pass
          security create-keychain -p "$PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASS" "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISION_PROFILE_BASE64" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/wecoop.mobileprovision"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_P8_BASE64" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_KEY_ID}.p8"
      - name: Pub get
        run: flutter pub get
      - name: Build IPA
        run: flutter build ipa --release
      - name: Upload + submit App Store
        env:
          APP_STORE_KEY_ID: ${{ secrets.APP_STORE_KEY_ID }}
          APP_STORE_ISSUER_ID: ${{ secrets.APP_STORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          xcrun altool --upload-app --type ios -f "$IPA" \
            --apiKey "$APP_STORE_KEY_ID" --apiIssuer "$APP_STORE_ISSUER_ID"
          VER="${{ github.event.inputs.version }}"
          BUILD="${{ github.event.inputs.build }}"
          if [ -z "$VER" ] || [ -z "$BUILD" ]; then
            VER=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+)\+.*/\1/')
            BUILD=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *[0-9.]+\+([0-9]+).*/\1/')
          fi
          # Wait briefly for ASC processing
          for i in 1 2 3 4 5 6; do
            python3 tools/submit_ios.py --version "$VER" --build "$BUILD" \
              --notes "WeCoop $VER (build $BUILD) — Hub ${{ github.event.inputs.source }}" \
              && exit 0
            sleep 30
          done
          echo "::warning::IPA uploaded; submit_ios still waiting for ASC processing — retry from Hub or Actions"
          exit 0
